substitutions:
  device_name: openquatt-simulator
  friendly_name: OpenQuatt Modbus and OpenTherm Simulator
  simulator_contract: openquatt-modbus-opentherm-v1
  simulator_version: v0.1.0
  odu_1_address: "1"
  odu_2_address: "2"

packages:
  boiler: !include hcq_v1_boiler_simulator.yaml
  quatt_odu: !include packages/quatt_odu_simulator.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  build_path: build/hcq_v1_system_simulator
  project:
    name: openquatt.simulator
    version: ${simulator_version}

text_sensor:
  - platform: template
    name: "OpenQuatt Simulator Contract"
    entity_category: diagnostic
    update_interval: 5s
    lambda: return {"${simulator_contract}"};

  - platform: template
    name: "OpenQuatt Simulator Version"
    entity_category: diagnostic
    update_interval: 5s
    lambda: return {"${simulator_version}"};

wifi:
  ap:
    ssid: "OpenQuatt Simulator"
