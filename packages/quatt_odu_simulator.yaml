text_sensor:
  - platform: template
    name: "ODU 1 diagnostics"
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      const auto &s = id(odu_simulator)->model(0).state();
      const uint32_t age = s.protocol.last_request_ms == 0 ? UINT32_MAX : millis() - s.protocol.last_request_ms;
      char text[240];
      snprintf(text, sizeof(text), "addr=%u profile=%s mode=%u req=%lu read=%lu write=%lu drop=%lu exc=%lu bad_addr=%lu bad_write=%lu cap=%lu maxF=%u age_ms=%lu last=FC%u R%u/%u W%u=%u",
               static_cast<unsigned>(id(odu_simulator)->get_address(0)),
               esphome::quatt_odu_simulator::profile_definition(s.profile).label,
               static_cast<unsigned>(s.active_mode), static_cast<unsigned long>(s.protocol.request_count),
               static_cast<unsigned long>(s.protocol.read_count), static_cast<unsigned long>(s.protocol.write_count),
               static_cast<unsigned long>(s.protocol.dropped_response_count),
               static_cast<unsigned long>(s.protocol.exception_count),
               static_cast<unsigned long>(s.protocol.invalid_address_count),
               static_cast<unsigned long>(s.protocol.invalid_write_count),
               static_cast<unsigned long>(s.protocol.level_capability_violations),
               static_cast<unsigned>(s.protocol.highest_requested_level), static_cast<unsigned long>(age),
               static_cast<unsigned>(s.protocol.last_function_code),
               static_cast<unsigned>(s.protocol.last_start_address),
               static_cast<unsigned>(s.protocol.last_register_count),
               static_cast<unsigned>(s.protocol.last_write_address),
               static_cast<unsigned>(s.protocol.last_write_value));
      return {text};
  - platform: template
    name: "ODU 2 diagnostics"
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      const auto &s = id(odu_simulator)->model(1).state();
      const uint32_t age = s.protocol.last_request_ms == 0 ? UINT32_MAX : millis() - s.protocol.last_request_ms;
      char text[240];
      snprintf(text, sizeof(text), "addr=%u profile=%s mode=%u req=%lu read=%lu write=%lu drop=%lu exc=%lu bad_addr=%lu bad_write=%lu cap=%lu maxF=%u age_ms=%lu last=FC%u R%u/%u W%u=%u",
               static_cast<unsigned>(id(odu_simulator)->get_address(1)),
               esphome::quatt_odu_simulator::profile_definition(s.profile).label,
               static_cast<unsigned>(s.active_mode), static_cast<unsigned long>(s.protocol.request_count),
               static_cast<unsigned long>(s.protocol.read_count), static_cast<unsigned long>(s.protocol.write_count),
               static_cast<unsigned long>(s.protocol.dropped_response_count),
               static_cast<unsigned long>(s.protocol.exception_count),
               static_cast<unsigned long>(s.protocol.invalid_address_count),
               static_cast<unsigned long>(s.protocol.invalid_write_count),
               static_cast<unsigned long>(s.protocol.level_capability_violations),
               static_cast<unsigned>(s.protocol.highest_requested_level), static_cast<unsigned long>(age),
               static_cast<unsigned>(s.protocol.last_function_code),
               static_cast<unsigned>(s.protocol.last_start_address),
               static_cast<unsigned>(s.protocol.last_register_count),
               static_cast<unsigned>(s.protocol.last_write_address),
               static_cast<unsigned>(s.protocol.last_write_value));
      return {text};

button:
  - platform: template
    name: "Apply ODU profiles and addresses, then reboot"
    icon: mdi:restart-alert
    entity_category: config
    on_press:
      - if:
          condition:
            lambda: |-
              return lroundf(id(odu_1_pending_address).state) !=
                     lroundf(id(odu_2_pending_address).state);
          then:
            - lambda: |-
                const auto decode = [](const std::string &option) -> uint8_t {
                  if (option == "V1") return 1;
                  if (option == "V1.5") return 2;
                  if (option == "V2 old") return 3;
                  if (option == "V2 new") return 4;
                  return 0;
                };
                id(odu_1_active_profile) = decode(id(odu_1_pending_profile).current_option());
                id(odu_2_active_profile) = decode(id(odu_2_pending_profile).current_option());
                id(odu_1_active_address) = lroundf(id(odu_1_pending_address).state);
                id(odu_2_active_address) = lroundf(id(odu_2_pending_address).state);
            - delay: 2s
            - button.press: restart_button

  - platform: template
    name: "Reset ODU diagnostics"
    icon: mdi:counter
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(odu_simulator)->reset_diagnostics();
          id(odu_modbus_hub)->reset_diagnostics();

  - platform: template
    name: "ODU 1 restore factory tables"
    entity_category: config
    on_press:
      - lambda: id(odu_simulator)->restore_factory_tables(0);

  - platform: template
    name: "ODU 2 restore factory tables"
    entity_category: config
    on_press:
      - lambda: id(odu_simulator)->restore_factory_tables(1);

  - platform: restart
    id: restart_button
    name: "Restart system simulator"
    entity_category: diagnostic

interval:
  - interval: 500ms
    then:
      - lambda: |-
          auto &simulator = *id(odu_simulator);
          simulator.set_simulation_enabled(id(odu_simulation_enabled).state);
          simulator.set_responses_enabled(id(odu_responses_enabled).state);
          simulator.set_odu_responses_enabled(0, id(odu_1_responses_enabled).state);
          simulator.set_odu_responses_enabled(1, id(odu_2_responses_enabled).state);
          simulator.set_outside_temperature(0, id(odu_1_outside_temperature).state);
          simulator.set_outside_temperature(1, id(odu_2_outside_temperature).state);
          simulator.set_water_in_temperature(0, id(odu_1_water_in_temperature).state);
          simulator.set_water_in_temperature(1, id(odu_2_water_in_temperature).state);
          simulator.set_table_write_enabled(0, id(odu_1_table_write_enabled).state);
          simulator.set_table_write_enabled(1, id(odu_2_table_write_enabled).state);
          simulator.set_defrost(0, id(odu_1_defrost).state);
          simulator.set_defrost(1, id(odu_2_defrost).state);
          simulator.set_force_no_flow(0, id(odu_1_no_flow).state);
          simulator.set_force_no_flow(1, id(odu_2_no_flow).state);
          simulator.set_freeze_frequency(0, id(odu_1_freeze_frequency).state);
          simulator.set_freeze_frequency(1, id(odu_2_freeze_frequency).state);
          simulator.set_hold_level_during_defrost(0, id(odu_1_hold_level_during_defrost).state);
          simulator.set_hold_level_during_defrost(1, id(odu_2_hold_level_during_defrost).state);
          simulator.set_fault_word(0, 0, lroundf(id(odu_1_fault_word_1).state));
          simulator.set_fault_word(0, 1, lroundf(id(odu_1_fault_word_2).state));
          simulator.set_fault_word(0, 2, lroundf(id(odu_1_fault_word_3).state));
          simulator.set_fault_word(1, 0, lroundf(id(odu_2_fault_word_1).state));
          simulator.set_fault_word(1, 1, lroundf(id(odu_2_fault_word_2).state));
          simulator.set_fault_word(1, 2, lroundf(id(odu_2_fault_word_3).state));

          auto &hub = *id(odu_modbus_hub);
          hub.set_response_delay_ms(lroundf(id(odu_response_delay_ms).state));
          hub.set_drop_every_nth(lroundf(id(odu_drop_every_nth).state));
          hub.set_timeout_injection(id(odu_timeout_enabled).state,
                                    lroundf(id(odu_timeout_start_address).state));
          hub.set_exception_injection(id(odu_exception_enabled).state,
                                      lroundf(id(odu_exception_start_address).state),
                                      lroundf(id(odu_exception_code).state));
          auto malformed = esphome::quatt_odu_simulator::MalformedResponseMode::NONE;
          if (id(odu_malformed_response).current_option() == "Wrong byte count")
            malformed = esphome::quatt_odu_simulator::MalformedResponseMode::WRONG_BYTE_COUNT;
          else if (id(odu_malformed_response).current_option() == "Incomplete response")
            malformed = esphome::quatt_odu_simulator::MalformedResponseMode::INCOMPLETE_RESPONSE;
          hub.set_malformed_injection(malformed, lroundf(id(odu_malformed_start_address).state));
          hub.set_reboot_injection(id(odu_reboot_on_read_enabled).state,
                                   lroundf(id(odu_reboot_start_address).state));
          for (uint8_t index = 0; index < 2; index++) {
            auto &settings = simulator.model(index).mutable_settings();
            settings.experimental_high_frequency_extrapolation =
                id(odu_experimental_high_frequency_extrapolation).state;
            if (id(odu_fast_simulation).state) {
              settings.compressor_start_delay_s = 0.25f;
              settings.minimum_runtime_s = 0.5f;
              settings.stop_delay_s = 0.25f;
              settings.ramp_up_hz_s = 100.0f;
              settings.ramp_down_hz_s = 100.0f;
            } else {
              settings.compressor_start_delay_s = 2.0f;
              settings.minimum_runtime_s = 5.0f;
              settings.stop_delay_s = 1.0f;
              settings.ramp_up_hz_s = 12.0f;
              settings.ramp_down_hz_s = 20.0f;
            }
          }
