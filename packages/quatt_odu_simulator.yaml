substitutions:
  # HCQ v1.0 M2 pin map. Do not replace with HCQ v1.1 pins.
  odu_modbus_tx_pin: GPIO40
  odu_modbus_rx_pin: GPIO39
  odu_modbus_flow_control_pin: GPIO38

external_components:
  - source:
      type: local
      path: components
    components: [quatt_odu_simulator]

uart:
  - id: odu_modbus_uart
    tx_pin: ${odu_modbus_tx_pin}
    rx_pin: ${odu_modbus_rx_pin}
    baud_rate: 19200
    data_bits: 8
    parity: EVEN
    stop_bits: 1
    rx_buffer_size: 512

quatt_odu_simulator:
  id: odu_simulator
  hub_id: odu_modbus_hub
  uart_id: odu_modbus_uart
  flow_control_pin: ${odu_modbus_flow_control_pin}
  odu_1_address: ${odu_1_address}
  odu_2_address: ${odu_2_address}
  update_interval: 250ms

globals:
  - id: odu_1_active_profile
    type: uint8_t
    restore_value: true
    initial_value: '0'
  - id: odu_2_active_profile
    type: uint8_t
    restore_value: true
    initial_value: '0'
  - id: odu_1_active_address
    type: uint8_t
    restore_value: true
    initial_value: '${odu_1_address}'
  - id: odu_2_active_address
    type: uint8_t
    restore_value: true
    initial_value: '${odu_2_address}'

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(odu_simulator)->set_address(0, id(odu_1_active_address));
          id(odu_simulator)->set_address(1, id(odu_2_active_address));
          id(odu_simulator)->set_profile(0, id(odu_1_active_profile));
          id(odu_simulator)->set_profile(1, id(odu_2_active_profile));

select:
  - platform: template
    id: odu_1_pending_profile
    name: "ODU 1 profile (pending)"
    icon: mdi:heat-pump-outline
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: Disabled
    options: [Disabled, V1, V1.5, V2 old, V2 new]

  - platform: template
    id: odu_2_pending_profile
    name: "ODU 2 profile (pending)"
    icon: mdi:heat-pump-outline
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: Disabled
    options: [Disabled, V1, V1.5, V2 old, V2 new]

  - platform: template
    id: odu_1_table_preset
    name: "ODU 1 frequency-table preset"
    entity_category: config
    optimistic: true
    restore_value: false
    initial_option: Factory
    options: [Factory, Runtime modified]
    on_value:
      - lambda: |-
          if (x == "Runtime modified")
            id(odu_simulator)->apply_runtime_modified_preset(0);
          else
            id(odu_simulator)->restore_factory_tables(0);

  - platform: template
    id: odu_2_table_preset
    name: "ODU 2 frequency-table preset"
    entity_category: config
    optimistic: true
    restore_value: false
    initial_option: Factory
    options: [Factory, Runtime modified]
    on_value:
      - lambda: |-
          if (x == "Runtime modified")
            id(odu_simulator)->apply_runtime_modified_preset(1);
          else
            id(odu_simulator)->restore_factory_tables(1);

  - platform: template
    id: odu_malformed_response
    name: "ODU malformed response"
    entity_category: config
    optimistic: true
    restore_value: false
    initial_option: Disabled
    options: [Disabled, Wrong byte count, Incomplete response]

